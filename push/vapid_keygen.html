<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>S.O.S 푸시 키 생성</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#212121;line-height:1.5}
h1{font-size:22px}.box{border:1.5px solid #ddd;border-radius:12px;padding:16px;margin:14px 0;background:#fafafa}
label{font-weight:800;display:block;margin-bottom:6px}textarea{width:100%;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;padding:10px;border:1px solid #ccc;border-radius:8px;min-height:64px}
button{padding:12px 18px;border:none;border-radius:10px;background:#2F5FDB;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button.s{background:#eee;color:#222;font-size:13px;padding:8px 12px;margin-top:6px}
.warn{background:#FFF3B0;border-left:4px solid #E0B000;padding:10px 12px;border-radius:8px;margin:12px 0}
ol li{margin:6px 0}
</style></head><body>
<h1>🔑 S.O.S 푸시 알림 키 생성</h1>
<p>버튼을 누르면 이 브라우저 안에서 키 한 쌍을 만듭니다. <b>어디로도 전송되지 않습니다.</b> 한 번만 만들고 안전한 곳에 보관하세요. 키를 다시 만들면 기존 등록 기기는 전부 다시 등록해야 합니다.</p>
<button onclick="gen()">키 생성</button>
<div id="out" style="display:none">
  <div class="box"><label>① 공개 키 — index.html 의 VAPID_PUBLIC_KEY 에 붙여넣기</label><textarea id="pub" readonly></textarea><button class="s" onclick="cp('pub')">복사</button></div>
  <div class="box"><label>② 비공개 키(JWK) — Cloudflare Worker 변수 VAPID_PRIVATE_JWK (Secret) 에 붙여넣기</label><textarea id="priv" readonly></textarea><button class="s" onclick="cp('priv')">복사</button></div>
  <div class="box"><label>③ 발송 비밀번호 — Worker 변수 SEND_KEY (Secret) 와 앱 관리 탭 "발송 키"에 같은 값</label><textarea id="sk" readonly style="min-height:40px"></textarea><button class="s" onclick="cp('sk')">복사</button></div>
  <div class="warn">②·③은 비밀입니다. 카톡·메일로 보내지 말고, Cloudflare 화면에 직접 붙여넣은 뒤 이 페이지를 닫으세요. ①만 코드에 들어갑니다.</div>
</div>
<script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function gen(){
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  const pubRaw=await crypto.subtle.exportKey('raw',kp.publicKey);
  document.getElementById('pub').value=b64u(pubRaw);
  document.getElementById('priv').value=JSON.stringify({kty:jwk.kty,crv:jwk.crv,x:jwk.x,y:jwk.y,d:jwk.d});
  document.getElementById('sk').value=b64u(crypto.getRandomValues(new Uint8Array(24)));
  document.getElementById('out').style.display='';
}
function cp(id){ const el=document.getElementById(id); el.select(); navigator.clipboard.writeText(el.value).then(()=>alert('복사되었습니다')); }
</script></body></html>
